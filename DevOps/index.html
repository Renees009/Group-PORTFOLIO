<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Portfolio</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('back.jpeg') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      padding: 20px;
      color: #fff;
      overflow-x: hidden;
    }

    h1 {
      margin-bottom: 40px;
      font-size: 3em;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
      animation: fadeInDown 1.5s ease;
    }

    .photo-center,
    .photo-gallery {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
      animation: fadeInUp 2s ease;
    }

    .photo-gallery {
      margin-top: 50px; /* Extra space between rows */
    }

    .team-member {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .team-member img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255,255,255,0.4);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .team-member img:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(255,255,255,0.8);
    }

    .designation {
      margin-top: 12px;
      font-size: 1.1rem;
      font-family: 'Times New Roman', Times, serif;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
      line-height: 1.4;
      letter-spacing: 0.5px; /* spacing between letters */
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <h1>Meet Our Team</h1>

  <!-- Centered photo with designations -->
  <div class="photo-center">
    <div class="team-member">
      <a href="Renees.html"><img src="renee.jpg" alt="Person 1"></a>
      <div class="designation">
        Team Leader<br>
        Junior Software Developer
      </div>
    </div>
  </div>

  <!-- Remaining photos with designations -->
  <div class="photo-gallery">
    <div class="team-member">
      <a href="Jebisha.html"><img src="jebi.jpg" alt="Person 2"></a>
      <div class="designation">Web Developer</div>
    </div>
    <div class="team-member">
      <a href="Rathnaa.html"><img src="rath.jpg" alt="Person 3"></a>
      <div class="designation">UI/UX Designer</div>
    </div>
    <div class="team-member">
      <a href="Shyma.html"><img src="shy.jpg" alt="Person 4"></a>
      <div class="designation">Backend Developer</div>
    </div>
    <div class="team-member">
      <a href="Stefflin.html"><img src="steff.jpg" alt="Person 5"></a>
      <div class="designation">QA Analyst</div>
    </div>
  </div>

</body>
</html>
